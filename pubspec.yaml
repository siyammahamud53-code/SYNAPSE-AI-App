name: synapse_ai_app
description: "SYNAPSE AI Client Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Network & Communication ---
  http: ^1.2.0
  web_socket_channel: ^2.4.1
  connectivity_plus: ^5.0.2

  # --- Voice & Audio ---
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.5
  audioplayers: ^5.2.1

  # --- System & Device Info ---
  permission_handler: ^11.3.0
  flutter_foreground_task: ^6.1.1
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  device_info_plus: ^9.1.1
  battery_plus: ^5.0.2
  flutter_phone_state: ~0.6.4
  provider: ^6.1.1

  # --- On-Device Hardware & Vision Processing ---
  google_mlkit_commons: ^0.6.0
  google_mlkit_object_detection: ^0.10.0
  image: ^4.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
