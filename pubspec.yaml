name: synapse_ai
description: SYNAPSE AI v3.0.0 - Autonomous OS Control & AI Assistant
version: 3.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core Dependencies
  cupertino_icons: ^1.0.6
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  
  # State Management
  provider: ^6.1.1
  
  # Networking & WebSocket
  http: ^1.1.0
  web_socket_channel: ^2.4.0
  dio: ^5.3.3
  json_annotation: ^4.8.1
  
  # Audio & Speech (JARVIS Voice Engine)
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.2
  audio_session: ^0.1.21
  just_audio: ^0.9.36
  
  # Camera & Storage
  camera: ^0.10.5
  image_picker: ^1.0.4
  flutter_image_compress: ^2.1.0
  
  # Native Integration & Services
  flutter_phone_direct_caller: ^2.1.1
  permission_handler: ^11.0.1
  flutter_native_splash: ^2.3.8
  flutter_local_notifications: ^16.1.0
  workmanager: ^0.5.1
  
  # UI Components
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  lottie: ^2.7.0
  shimmer: ^3.0.0
  animated_text_kit: ^4.2.2
  
  # Utilities
  shared_preferences: ^2.2.2
  path_provider: ^2.1.0
  connectivity_plus: ^5.0.1
  device_info_plus: ^9.1.1
  package_info_plus: ^4.2.0
  battery_plus: ^5.0.0
  sensors_plus: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.9
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

flutter_native_splash:
  color: "#0A0A0F"
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  fullscreen: true
