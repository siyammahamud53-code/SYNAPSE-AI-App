name: Build Flutter Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Locate Flutter Project Directory
        id: set-dir
        run: |
          if [ -d "SYNAPSE-AI-App" ]; then
            echo "working_dir=SYNAPSE-AI-App" >> $GITHUB_ENV
          else
            echo "working_dir=." >> $GITHUB_ENV
          fi

      - name: Enable AndroidX & Setup Properties
        run: |
          mkdir -p ${{ env.working_dir }}/android
          cat << 'EOF' > ${{ env.working_dir }}/android/gradle.properties
          org.gradle.jvmargs=-Xmx4608m
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Ensure Gradle Wrapper 8.4 Exists
        run: |
          mkdir -p ${{ env.working_dir }}/android/gradle/wrapper
          cat << 'EOF' > ${{ env.working_dir }}/android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-all.zip
          EOF

      - name: Clean Conflicting Legacy Files & Fix Manifest
        run: |
          MANIFEST_PATH="${{ env.working_dir }}/android/app/src/main/AndroidManifest.xml"
          sed -i 's/package="[^"]*"//g' "$MANIFEST_PATH"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST_PATH"; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST_PATH"
          fi
          find ${{ env.working_dir }}/android/ -name "GeneratedPluginRegistrant.java" -exec rm -fv {} +

      - name: Get Dependencies
        working-directory: ${{ env.working_dir }}
        run: flutter pub get

      - name: Build Release APK
        working-directory: ${{ env.working_dir }}
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SYNAPSE-AI-Release-APK
          path: ${{ env.working_dir }}/build/app/outputs/flutter-apk/app-release.apk
