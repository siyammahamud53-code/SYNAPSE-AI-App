name: Build Flutter Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Locate Working Directory
        id: locate-dir
        run: |
          if [ -d "SYNAPSE-AI-App" ] && [ -f "SYNAPSE-AI-App/pubspec.yaml" ]; then
            echo "target_dir=SYNAPSE-AI-App" >> $GITHUB_ENV
          else
            echo "target_dir=." >> $GITHUB_ENV
          fi

      - name: Enable AndroidX & Setup Gradle Properties
        run: |
          mkdir -p ${{ env.target_dir }}/android
          cat << 'EOF' > ${{ env.target_dir }}/android/gradle.properties
          org.gradle.jvmargs=-Xmx4608m
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Ensure Gradle Wrapper 8.4
        run: |
          mkdir -p ${{ env.target_dir }}/android/gradle/wrapper
          cat << 'EOF' > ${{ env.target_dir }}/android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-all.zip
          EOF

      - name: Clean Manifest Package Attribute
        run: |
          MANIFEST_PATH="${{ env.target_dir }}/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i 's/package="[^"]*"//g' "$MANIFEST_PATH"
          fi

      - name: Force Clean Build Artifacts
        working-directory: ${{ env.target_dir }}
        run: |
          flutter clean
          flutter pub get

      - name: Build Release APK
        working-directory: ${{ env.target_dir }}
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SYNAPSE-AI-Release-APK
          path: ${{ env.target_dir }}/build/app/outputs/flutter-apk/app-release.apk
