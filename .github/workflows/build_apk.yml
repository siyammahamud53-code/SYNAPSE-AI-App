name: Build Flutter Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Ensure Gradle Wrapper 8.4 Exists
        run: |
          mkdir -p android/gradle/wrapper
          cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-all.zip
          EOF
          echo "Gradle 8.4 wrapper property successfully injected!"

      - name: Fix AndroidManifest Package Attribute & Inject Permissions
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          # Remove outdated package attribute from manifest tag
          sed -i 's/package="[^"]*"//g' "$MANIFEST_PATH"
          
          # Inject Internet permission if missing
          if ! grep -q "android.permission.INTERNET" "$MANIFEST_PATH"; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST_PATH"
          fi
          echo "Successfully cleaned AndroidManifest!"

      - name: Get Dependencies
        run: flutter pub get

      - name: Clean Project
        run: flutter clean

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SYNAPSE-AI-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
