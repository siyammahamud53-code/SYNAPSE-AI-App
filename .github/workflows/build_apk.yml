name: SYNAPSE AI Build & Deploy

on:
  push:
    branches: [ main, develop, release/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.5'
  JAVA_VERSION: '17'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Verify Environment
        run: |
          flutter --version
          java -version

      - name: Get Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons --dart-define=GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" --dart-define=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapse-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
