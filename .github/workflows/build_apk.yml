name: Build Flutter Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Generate Fresh Flutter Project
        run: |
          mkdir -p temp_app
          cd temp_app
          flutter create --org com.synapse --project-name synapse_ai_app .
          cp -r android ../
          cp pubspec.yaml ../ 2>/dev/null || true

      - name: Force Inject Internet Permission
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if grep -q "android.permission.INTERNET" "$MANIFEST_PATH"; then
            echo "Internet permission already exists."
          else
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' "$MANIFEST_PATH"
            echo "Successfully injected Internet Permission!"
          fi

      - name: Add Required Packages
        run: flutter pub add http

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SYNAPSE-AI-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
