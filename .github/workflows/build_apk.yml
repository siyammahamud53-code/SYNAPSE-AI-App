name: SYNAPSE AI Build & Deploy

on:
  push:
    branches: [ main, develop, release/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.3'
  JAVA_VERSION: '17'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Verify Environment
        run: |
          flutter --version
          java -version

      - name: Get Dependencies
        run: |
          flutter clean
          flutter pub upgrade
          flutter pub get

      - name: Generate Code & Assets
        run: |
          dart run build_runner build --delete-conflicting-outputs || true
          dart run flutter_native_splash:create || true

      - name: Build Debug APK
        run: |
          flutter build apk --debug

      - name: Build Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons || flutter build apk --release

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapse-ai-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapse-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
